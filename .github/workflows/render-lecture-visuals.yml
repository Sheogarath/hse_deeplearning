name: Render and index lecture visuals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/render_lecture_visuals.py'
      - '.github/workflows/render-lecture-visuals.yml'
      - '**/*.pptx'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install render and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice poppler-utils tesseract-ocr tesseract-ocr-rus
          python -m pip install pillow
      - name: Render all lecture slides
        run: python tools/render_lecture_visuals.py
      - name: Commit searchable visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture_visuals/
          if ! git diff --cached --quiet; then
            git commit -m "docs: index lecture diagrams and slide visuals"
            git pull --rebase
            git push
          fi
