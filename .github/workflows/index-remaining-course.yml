name: Index remaining course files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/index_remaining_course.py'
      - '.github/workflows/index-remaining-course.yml'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/index_remaining_course.py
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COURSE_CODE_REVIEW/
          if ! git diff --cached --quiet; then
            git commit -m "docs: index remaining course code and notebooks"
            git pull --rebase
            git push
          fi
