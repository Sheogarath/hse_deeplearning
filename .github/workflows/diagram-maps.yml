name: Build compact diagram maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.pptx'
      - 'tools/summarize_diagrams.py'
      - '.github/workflows/diagram-maps.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/summarize_diagrams.py
      - name: Save diagram maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture_diagram_maps/
          if ! git diff --cached --quiet; then
            git commit -m "docs: add compact spatial diagram maps"
            git pull --rebase
            git push
          fi
