name: Extract PowerPoint lecture text
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.pptx'
      - 'tools/extract_lectures.py'
      - '.github/workflows/extract-lecture-text.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract slide text
        run: python tools/extract_lectures.py
      - name: Commit generated Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture_text/
          if ! git diff --cached --quiet; then
            git commit -m "docs: extract PowerPoint lecture text"
            git push
          fi
