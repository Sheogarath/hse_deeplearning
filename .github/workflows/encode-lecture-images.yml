name: Expose lecture visuals to text-only GitHub readers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/encode_lecture_images.py'
      - '.github/workflows/encode-lecture-images.yml'
      - 'lecture_visuals/**/*.jpg'
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/encode_lecture_images.py
      - name: Commit encoded contact sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture_image_data/
          if ! git diff --cached --quiet; then
            git commit -m "docs: expose lecture visuals as readable image data"
            git pull --rebase
            git push
          fi
