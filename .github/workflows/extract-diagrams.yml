name: Extract native diagram structures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.pptx'
      - 'tools/extract_diagrams.py'
      - '.github/workflows/extract-diagrams.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract diagram geometry
        run: python tools/extract_diagrams.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture_diagrams/
          if ! git diff --cached --quiet; then
            git commit -m "docs: index native PowerPoint diagrams"
            git pull --rebase
            git push
          fi
